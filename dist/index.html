<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5ef" />
    <meta name="description" content="财智管家——清晰掌握账户、账单、预算、投资与财务目标。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>财智管家 · 个人资产管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg aria-hidden="true" class="icon-sprite">
      <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H19a1 1 0 0 1 1 1v13H6a2 2 0 0 1-2-2V7.5Z"/><path d="M4 8h15"/><path d="M16 12h5v4h-5a2 2 0 0 1 0-4Z"/></symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3v18l3-2 3 2 3-2 3 2V3l-3 2-3-2-3 2-3-2Z"/><path d="M9 9h6M9 13h6"/></symbol>
      <symbol id="i-budget" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M16 3.8A9 9 0 0 1 20.2 8H16V3.8Z"/></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 2 5-6"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.08V21H9.6v-.08A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.52-1H3v-4h.08A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.08V3h4v.08A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.08.4H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
      <symbol id="i-bank" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5H3ZM5 10v7m5-7v7m4-7v7m5-7v7M3 20h18M2 17h20"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></symbol>
      <symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M7 9H6v1m11-1h1v1M7 15H6v-1m11 1h1v-1"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.9 8.4 7 10 4.1-1.6 7-5.2 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-5"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5m-5 5 5-5 5 5M5 21h14"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark">财</span>
          <span class="brand-copy"><strong>财智管家</strong><small>清晰掌握每一笔</small></span>
        </div>

        <nav class="side-nav">
          <button class="nav-item is-active" data-route="dashboard"><svg><use href="#i-dashboard"/></svg><span>财务总览</span></button>
          <button class="nav-item" data-route="accounts"><svg><use href="#i-wallet"/></svg><span>账户资产</span></button>
          <button class="nav-item" data-route="transactions"><svg><use href="#i-receipt"/></svg><span>收支账单</span></button>
          <button class="nav-item" data-route="budgets"><svg><use href="#i-budget"/></svg><span>月度预算</span></button>
          <button class="nav-item" data-route="investments"><svg><use href="#i-trend"/></svg><span>投资组合</span></button>
          <button class="nav-item" data-route="goals"><svg><use href="#i-target"/></svg><span>财务目标</span></button>
          <button class="nav-item" data-route="settings"><svg><use href="#i-settings"/></svg><span>数据与设置</span></button>
        </nav>

        <div class="side-insight" id="side-insight"></div>
        <div class="profile-card">
          <span class="avatar">林</span>
          <span><strong>林晓</strong><small>本地演示账户</small></span>
          <button class="icon-button" aria-label="更多账户选项"><svg><use href="#i-more"/></svg></button>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim"></div>

      <section class="workspace">
        <header class="topbar">
          <div class="topbar-title">
            <button class="icon-button mobile-menu" id="mobile-menu" aria-label="打开导航"><svg><use href="#i-menu"/></svg></button>
            <div><span class="eyebrow" id="page-eyebrow">个人财务中心</span><h1 id="page-title">早上好，林晓</h1></div>
          </div>
          <div class="topbar-actions">
            <span class="privacy-chip"><svg><use href="#i-shield"/></svg>数据仅存本机</span>
            <button class="icon-button notification-button" data-action="show-notifications" aria-label="查看通知"><svg><use href="#i-bell"/></svg><span class="notification-dot"></span></button>
            <button class="primary-button compact" data-action="add-transaction"><svg><use href="#i-plus"/></svg><span>记一笔</span></button>
          </div>
        </header>

        <main id="main-content" tabindex="-1"></main>
      </section>
    </div>

    <button class="mobile-fab" data-action="add-transaction" aria-label="记一笔"><svg><use href="#i-plus"/></svg></button>

    <dialog class="app-dialog" id="entity-dialog">
      <form id="entity-form">
        <div class="dialog-head">
          <div><span class="eyebrow" id="dialog-eyebrow">快速记录</span><h2 id="dialog-title">新增</h2></div>
          <button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="dialog-body" id="dialog-body"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary-button" data-action="close-dialog">取消</button>
          <button type="submit" class="primary-button" id="dialog-submit">保存</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="import-input" accept="application/json" hidden />
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
